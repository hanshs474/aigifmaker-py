[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigifmaker"
version = "0.1.1"
description = "Official SDK for AI GIF Maker (aigifmaker.ai): turn text into animated GIFs."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "hanshs474" }]
keywords = ["ai", "gif", "gif-maker", "ai-gif-generator", "text-to-gif", "animated-gif", "aigifmaker"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://aigifmaker.ai/?utm_source=pypi&utm_medium=package"
"API keys" = "https://aigifmaker.ai/settings/apikeys"
Source = "https://github.com/hanshs474/aigifmaker-py"

[tool.setuptools.packages.find]
where = ["src"]
